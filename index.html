<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#848b79" />
    <title>Birthday Quest</title>
    <link rel="stylesheet" href="./styles.css?v=1" />
  </head>

  <body>
    <div class="bg-dots" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <div class="brand-dot" aria-hidden="true"></div>
        <div class="brand-text">
          <div class="brand-title">Birthday Quest!?</div>
          <div class="brand-subtitle">for Teteh ✦ from Baba</div>
        </div>
      </div>

      <br/> 

      <button id="soundBtn" class="chip" type="button" aria-label="Toggle sound">
        🔈 Sound: On
      </button>
    </header>

    <main id="app" class="app" role="main"></main>

    <nav class="bottom-nav" aria-label="Primary">
      <button class="nav-btn" data-nav="home" type="button" aria-current="page">
        <span class="nav-ic" aria-hidden="true">🏠</span>
        <span class="nav-tx">Home</span>
      </button>
      <button class="nav-btn" data-nav="levels" type="button">
        <span class="nav-ic" aria-hidden="true">🎮</span>
        <span class="nav-tx">Levels</span>
      </button>
      <button class="nav-btn" data-nav="notes" type="button">
        <span class="nav-ic" aria-hidden="true">💌</span>
        <span class="nav-tx">Notes</span>
      </button>
      <button class="nav-btn" data-nav="settings" type="button">
        <span class="nav-ic" aria-hidden="true">⚙️</span>
        <span class="nav-tx">Settings</span>
      </button>
    </nav>

    <div id="toasts" class="toasts" aria-live="polite" aria-atomic="true"></div>

    <!-- cache-bust while developing -->
    <script src="./app.js?v=1"></script>
  </body>
</html>
